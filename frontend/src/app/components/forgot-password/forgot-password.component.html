<div>
  <form [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>email</mat-label>
      <input matInput placeholder="Email" formControlName="email" type="email">
      @if (form.get('email')?.hasError('required')) {
        <mat-error>
          Email muss angegeben werden!
        </mat-error>
      }
      @if (form.get('email')?.hasError('email')) {
        <mat-error>
          Bitte eine gültige Email Adresse angeben!
        </mat-error>
      }
    </mat-form-field>

    <button mat-flat-button color="primary" (click)="resetPwd()" [disabled]="form.invalid || form.disabled">Passwort zurücksetzen</button>

    <div class="container">
      <button mat-stroked-button routerLink="/login" type="button">Login<mat-icon>chevron_left</mat-icon></button>
    </div>
  </form>
</div>
