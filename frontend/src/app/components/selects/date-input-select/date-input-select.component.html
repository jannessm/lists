<mat-chip-listbox [(ngModel)]="chipOption" [disabled]="disabled" (click)="updateTime()">
  @for (item of options; track $index) {
    <mat-chip-option [value]="item[0]">{{item[1]}}</mat-chip-option>
  }
</mat-chip-listbox>

<div class="picker-anchor">
  <button type="button" mat-stroked-button [disabled]="disabled" (click)="openDatePicker()">
    {{ dateLabel }}
  </button>
</div>
