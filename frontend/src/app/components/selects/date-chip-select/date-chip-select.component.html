<mat-chip-listbox [(ngModel)]="chipOption" [disabled]="disabled" (change)="changeOption($event)">
  @for (item of options; track $index) {
    <mat-chip-option [value]="item[0]">{{item[1]}}</mat-chip-option>
  }

  @if (showOthers) {
    <mat-chip-option value="different">
      {{(date | date:'short') || 'Andere'}}
    </mat-chip-option>
  }
</mat-chip-listbox>
<input type="datetime-local" #pickr>
