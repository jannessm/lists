<div class="content-grid">
  <div class="content-header">
    <h2>Lists</h2>

    <button
      mat-icon-button
      class="add-button"
      (click)="addList()">
      <mat-icon>add</mat-icon>
    </button>
  </div>
  <div class="container">
    @if (!lists || !lists || lists.length === 0) {
      <div class="no-lists">Keine Listen vorhanden</div>
    }

    @for (l of lists; track l.id) {
      <button
        class="list-card"
        mat-raised-button
        [routerLink]="'/user/lists/' + l.id">
        <span>{{ l.name }}</span>
        @if (l.isShoppingList) {
          <mat-icon [style.color]="'#999'">shopping_basket</mat-icon>
        }
      </button>
    }
  </div>
</div>
